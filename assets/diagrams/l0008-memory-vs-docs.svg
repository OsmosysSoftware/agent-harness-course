<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-label="The same slice, two ways. Top lane, from memory: the agent writes OrderByDescending on CreatedAt, a DateTimeOffset. It compiles, but GET /api/orders answers 500, and the API log says SQLite does not support expressions of type DateTimeOffset in ORDER BY clauses. Bottom lane, docs first: the agent calls the context7 query-docs tool, reads that comparison and ordering of DateTimeOffset need evaluation on the client, stores CreatedAt with DateTimeOffsetToBinaryConverter, and GET /api/orders answers 200, newest first, with the test green.">
<defs><marker id="l8m-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="l8-lane l8-lane-bad" x="14" y="14" width="832" height="220" rx="14"/>
<text class="l8-lanetitle l8-badtxt" x="34" y="42">FROM MEMORY</text>
<text class="l8-lanesub" x="160" y="42">the API as the model remembers it</text>
<rect class="l8-lane" x="14" y="258" width="832" height="228" rx="14"/>
<text class="l8-lanetitle l8-goodtxt" x="34" y="286">DOCS FIRST</text>
<text class="l8-lanesub" x="140" y="286">the API as the docs describe it today</text>
<g class="st s1 s2"><rect class="panel" x="34" y="58" width="262" height="150" rx="10"/><text class="mono strong" x="48" y="82">OrdersController.cs</text><text class="l8-code" x="48" y="108">await db.Orders</text><text class="l8-code" x="48" y="127">  .OrderByDescending(</text><text class="l8-code" x="48" y="146">     o =&gt; o.CreatedAt)</text><text class="l8-code" x="48" y="165">  .ToListAsync(ct);</text><text class="l8-comment" x="48" y="194">// CreatedAt is a DateTimeOffset</text></g>
<g class="st s1"><rect class="chip pass" x="318" y="66" width="150" height="30" rx="15"/><text class="chiptxt" x="393" y="86">it compiles ✓</text></g>
<g class="st s2"><path class="arc l8-arrbad" d="M298,150 L324,150" marker-end="url(#l8m-head)"/><rect class="l8-fail" x="330" y="112" width="140" height="76" rx="10"/><text class="l8-mono-sm" x="400" y="134" style="text-anchor:middle">GET /api/orders</text><text class="l8-big l8-badtxt" x="400" y="174" style="text-anchor:middle">500</text><path class="arc l8-arrbad" d="M472,150 L498,150" marker-end="url(#l8m-head)"/><rect class="l8-term" x="504" y="58" width="326" height="158" rx="10"/><text class="l8-termhead" x="518" y="80">API log</text><text class="l8-termtxt" x="518" y="106">System.NotSupportedException:</text><text class="l8-termtxt" x="518" y="125">SQLite does not support expressions</text><text class="l8-termtxt" x="518" y="144">of type 'DateTimeOffset' in ORDER BY</text><text class="l8-termtxt" x="518" y="163">clauses. Convert the values to a</text><text class="l8-termtxt" x="518" y="182">supported type, or use LINQ to …</text></g>
<g class="st s3 s4 s5"><rect class="panel" x="34" y="302" width="262" height="170" rx="10"/><rect class="l8-tool" x="46" y="314" width="238" height="28" rx="14"/><text class="l8-tooltxt" x="165" y="333">mcp__context7__query-docs</text><text class="l8-q" x="48" y="364">“EF Core SQLite limitations”</text><text class="l8-quote" x="48" y="394">“DateTimeOffset … comparison</text><text class="l8-quote" x="48" y="414">and ordering will require</text><text class="l8-quote" x="48" y="434">evaluation on the client”</text><text class="l8-src" x="48" y="458">EF Core docs, via context7</text></g>
<g class="st s4 s5"><path class="arc " d="M298,386 L324,386" marker-end="url(#l8m-head)"/><rect class="panel" x="330" y="302" width="300" height="170" rx="10"/><text class="mono strong" x="344" y="326">StockDbContext.cs</text><text class="l8-code" x="344" y="352">.Property(o =&gt; o.CreatedAt)</text><text class="l8-code" x="344" y="371">.HasConversion(new</text><text class="l8-code" x="344" y="390">  DateTimeOffsetToBinaryConverter())</text><text class="l8-note" x="344" y="420">stored as an INTEGER that SQLite</text><text class="l8-note" x="344" y="438">can sort; the query stays the same</text></g>
<g class="st s5"><path class="arc " d="M632,386 L650,386" marker-end="url(#l8m-head)"/><rect class="l8-ok" x="656" y="318" width="174" height="140" rx="10"/><text class="l8-mono-sm" x="743" y="342" style="text-anchor:middle">GET /api/orders</text><text class="l8-big l8-goodtxt" x="743" y="384" style="text-anchor:middle">200</text><text class="l8-note" x="743" y="410" style="text-anchor:middle">newest first</text><rect class="chip pass" x="676" y="422" width="134" height="26" rx="13"/><text class="chiptxt" x="743" y="440">dotnet test ✓</text></g>
