<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" role="img" aria-label="A ladder of evidence, strongest first. 1, the raw transcript: shows what was asked, run and seen, in order, but not that anyone read it, and it can hold secrets. 2, git history: what changed, by whom and in what order, but not why, and it can be replayed afterwards. 3, files in the repo: what exists now, but not when it arrived. 4, notes, README and reflections: claims, to check against 1 and 2. Example: a note says JWT was rejected, and a commit one minute later adds JWT, so the note is stale.">
<defs><marker id="l10l-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<path class="l10-rail" d="M36,40 L36,404" marker-end="url(#l10l-head)"/><text class="l10-railtxt" transform="rotate(-90 26 222)" x="26" y="222">stronger  →  weaker</text>
<g class="st s1"><rect class="l10-rung" x="70" y="24" width="450" height="88" rx="10"/><circle class="l10-num" cx="100" cy="68" r="17"/><text class="l10-numtxt" x="100" y="74">1</text><text class="l10-title" x="132" y="52">Raw transcript (.jsonl, /export)</text><text class="l10-proves" x="132" y="78">✓ what was asked, run and seen, in order</text><text class="l10-cant" x="132" y="100">✗ that anyone read it · it can hold secrets</text></g>
<g class="st s2 s5"><rect class="l10-rung" x="70" y="126" width="450" height="88" rx="10"/><circle class="l10-num" cx="100" cy="170" r="17"/><text class="l10-numtxt" x="100" y="176">2</text><text class="l10-title" x="132" y="154">Git history</text><text class="l10-proves" x="132" y="180">✓ what changed, by whom, in what order</text><text class="l10-cant" x="132" y="202">✗ why · and it can be replayed afterwards</text></g>
<g class="st s3"><rect class="l10-rung" x="70" y="228" width="450" height="88" rx="10"/><circle class="l10-num" cx="100" cy="272" r="17"/><text class="l10-numtxt" x="100" y="278">3</text><text class="l10-title" x="132" y="256">Files in the repo</text><text class="l10-proves" x="132" y="282">✓ what exists right now</text><text class="l10-cant" x="132" y="304">✗ when it arrived, or what it steered</text></g>
<g class="st s4 s5"><rect class="l10-rung l10-claim" x="70" y="330" width="450" height="88" rx="10"/><circle class="l10-num" cx="100" cy="374" r="17"/><text class="l10-numtxt" x="100" y="380">4</text><text class="l10-title" x="132" y="358">Notes, README, reflections</text><text class="l10-proves" x="132" y="384">✓ why, in someone’s own words</text><text class="l10-cant" x="132" y="406">✗ anything, until checked against 1 and 2</text></g>
<g class="st s4 s5"><text class="l10-head" x="560" y="40">Checking one claim</text><rect class="l10-card l10-claim" x="560" y="56" width="270" height="78" rx="8"/><text class="l10-cardname" x="574" y="80">a note in the repo says</text><text class="l10-quote" x="574" y="112">“JWT rejected, not requested”</text><path class="l10-link" d="M520,370 C540,370 540,95 556,95"/></g>
<g class="st s5"><path class="arc" d="M695,138 L695,178" marker-end="url(#l10l-head)"/><text class="l10-small" x="706" y="164">check it against git</text><rect class="l10-card" x="560" y="186" width="270" height="78" rx="8"/><text class="l10-cardname" x="574" y="210">git log, one minute later</text><text class="l10-mono" x="574" y="242">a commit adds JWT</text><path class="l10-link" d="M520,170 C540,170 540,225 556,225"/><rect class="l10-verdict" x="560" y="290" width="270" height="40" rx="20"/><text class="l10-verdicttxt" x="695" y="316">STALE · git contradicts it</text><text class="l10-small" x="695" y="360" style="text-anchor:middle">Label each claim TRUE, STALE or</text><text class="l10-small" x="695" y="380" style="text-anchor:middle">UNVERIFIABLE, as in lesson 9.</text></g>
</svg>
