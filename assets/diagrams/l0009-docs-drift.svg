<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 484" role="img" aria-label="Docs drift. Left, four claims from the docs; right, what the repo shows. The update-docs skill draws a line from each claim to its evidence. AGENTS.md says build with -warnaserror, and gate.sh line 12 does: TRUE. The README lists 4 endpoints, the controllers have 6: STALE. A real project’s doc said JWT was rejected, not requested, and git log shows JWT added one minute later: STALE. “We carefully considered SQL Server” has no file, commit or test behind it: UNVERIFIABLE. It then proposes a diff for the stale rows only, and waits for you.">
