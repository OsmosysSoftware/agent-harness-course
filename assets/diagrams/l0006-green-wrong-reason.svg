<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-label="Green for the wrong reason. A read-then-write version of OrderService passes every test, because each test sends one order at a time. Two orders arriving together both read stock 3, both pass the check and both write 0: six units sold of three. Measured: 12 concurrent orders for 3 units all succeed without the transaction, and exactly 3 succeed inside one on SQLite, because the provider locks up front. The stock reviewer reads the code’s shape and blocks line 18.">
