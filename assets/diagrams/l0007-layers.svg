<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Five layers a bad action must pass: a rule in AGENTS.md, which is only a request, then a PreToolUse hook, a permission rule, a git hook and a guard test. A force-push is stopped by the hook and the permission rule. A vague commit message and a committed secret pass the agent-side layers and are stopped by the git hooks. An overselling read-then-write rewrite passes everything until the guard test fails, 12 orders instead of 3. The same rewrite inside a transaction passes the test too; only the reviewer from lesson 6 catches it.">
<defs><marker id="l7l-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<g class="st s1">
<rect class="l7-col req" x="264.0" y="20" width="116" height="470" rx="12"/>
<rect class="l7-col" x="394.0" y="20" width="116" height="470" rx="12"/>
<rect class="l7-col" x="524.0" y="20" width="116" height="470" rx="12"/>
<rect class="l7-col" x="654.0" y="20" width="116" height="470" rx="12"/>
<rect class="l7-col" x="784.0" y="20" width="116" height="470" rx="12"/>
<text class="l7-note" x="322" y="514">a request</text>
<text class="l7-note guard" x="647.0" y="514">guards: code that refuses</text>
<path class="l7-brace" d="M400.0,496 h494"/>
</g>
<text class="l7-head" x="322" y="50">Rule</text><text class="l7-headsub" x="322" y="70">AGENTS.md</text>
<text class="l7-head" x="452" y="50">PreToolUse hook</text><text class="l7-headsub" x="452" y="70">Bash only</text>
<text class="l7-head" x="582" y="50">Permission</text><text class="l7-headsub" x="582" y="70">settings.json</text>
<text class="l7-head" x="712" y="50">Git hook</text><text class="l7-headsub" x="712" y="70">.githooks/</text>
<text class="l7-head" x="842" y="50">Guard test</text><text class="l7-headsub" x="842" y="70">dotnet test</text>
<text class="l7-head" x="20" y="50" style="text-anchor:start">A bad action</text>
<g class="st s2"><text class="lbl" x="20" y="124" style="text-anchor:start;font-size:15px">Force-push</text><text class="sub" x="20" y="143" style="text-anchor:start;font-size:13px">git push --force</text><path class="arc" d="M216,128 L422,128" marker-end="url(#l7l-head)"/><circle class="l7-thru" cx="322" cy="128" r="5"/><text class="l7-passtxt" x="322" y="154">talked out of it</text><rect class="l7-stop" x="426" y="114" width="52" height="28" rx="14"/><text class="l7-stoptxt" x="452" y="133">STOP</text><text class="l7-why" x="452" y="160">deny + reason</text><rect class="l7-stop" x="556" y="114" width="52" height="28" rx="14"/><text class="l7-stoptxt" x="582" y="133">STOP</text><text class="l7-why" x="582" y="160">deny rule</text><text class="l7-none" x="712" y="133">·</text><text class="l7-none" x="842" y="133">·</text></g>
<g class="st s3"><text class="lbl" x="20" y="194" style="text-anchor:start;font-size:15px">Vague message</text><text class="sub" x="20" y="213" style="text-anchor:start;font-size:13px">“Update the changes”</text><path class="arc" d="M216,198 L682,198" marker-end="url(#l7l-head)"/><circle class="l7-thru" cx="322" cy="198" r="5"/><text class="l7-passtxt" x="322" y="224">you typed it</text><circle class="l7-thru" cx="452" cy="198" r="5"/><text class="l7-passtxt" x="452" y="224">doesn’t read it</text><circle class="l7-thru" cx="582" cy="198" r="5"/><text class="l7-passtxt" x="582" y="224">doesn’t read it</text><rect class="l7-stop" x="686" y="184" width="52" height="28" rx="14"/><text class="l7-stoptxt" x="712" y="203">STOP</text><text class="l7-why" x="712" y="230">commit-msg</text><text class="l7-none" x="842" y="203">·</text></g>
<g class="st s4"><text class="lbl" x="20" y="264" style="text-anchor:start;font-size:15px">Committed secret</text><text class="sub" x="20" y="283" style="text-anchor:start;font-size:13px">a readable JWT key</text><path class="arc" d="M216,268 L682,268" marker-end="url(#l7l-head)"/><circle class="l7-thru" cx="322" cy="268" r="5"/><text class="l7-passtxt" x="322" y="294">forgotten</text><circle class="l7-thru" cx="452" cy="268" r="5"/><text class="l7-passtxt" x="452" y="294">never sees edits</text><circle class="l7-thru" cx="582" cy="268" r="5"/><text class="l7-passtxt" x="582" y="294">an edit is allowed</text><rect class="l7-stop" x="686" y="254" width="52" height="28" rx="14"/><text class="l7-stoptxt" x="712" y="273">STOP</text><text class="l7-why" x="712" y="300">pre-commit</text><text class="l7-none" x="842" y="273">·</text></g>
<g class="st s5"><text class="lbl" x="20" y="334" style="text-anchor:start;font-size:15px">Overselling rewrite</text><text class="sub" x="20" y="353" style="text-anchor:start;font-size:13px">read-then-write</text><path class="arc" d="M216,338 L812,338" marker-end="url(#l7l-head)"/><circle class="l7-thru" cx="322" cy="338" r="5"/><text class="l7-passtxt" x="322" y="364">“still correct”</text><circle class="l7-thru" cx="452" cy="338" r="5"/><text class="l7-passtxt" x="452" y="364">never sees edits</text><circle class="l7-thru" cx="582" cy="338" r="5"/><text class="l7-passtxt" x="582" y="364">an edit is allowed</text><circle class="l7-thru" cx="712" cy="338" r="5"/><text class="l7-passtxt" x="712" y="364">code looks fine</text><rect class="l7-stop" x="816" y="324" width="52" height="28" rx="14"/><text class="l7-stoptxt" x="842" y="343">STOP</text><text class="l7-why" x="842" y="370">3 vs 12 orders</text></g>
<g class="st s6 l7-slip"><text class="lbl" x="20" y="404" style="text-anchor:start;font-size:15px">Same, in a transaction</text><text class="sub" x="20" y="423" style="text-anchor:start;font-size:13px">still read-then-write</text><path class="arc" d="M216,408 L916.0,408" marker-end="url(#l7l-head)"/><circle class="l7-thru" cx="322" cy="408" r="5"/><circle class="l7-thru" cx="452" cy="408" r="5"/><circle class="l7-thru" cx="582" cy="408" r="5"/><circle class="l7-thru" cx="712" cy="408" r="5"/><circle class="l7-thru" cx="842" cy="408" r="5"/><text class="l7-passtxt" x="842" y="434">green on SQLite</text><text class="l7-slipnote" x="946" y="458">reviewer (lesson 6) catches it</text></g>
</svg>
