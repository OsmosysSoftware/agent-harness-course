<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="A pasted prompt versus a skill. Left: one commit template kept in a notes file is pasted by hand into three sessions; one copy names the wrong project and another has lost its secret-scan line. Right: the procedure is one SKILL.md file in the repo; every session loads the same file by typing /commit, and one reviewed commit fixes it for every later run.">
<defs><marker id="l5p-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="l5-tag l5-bad" x="40" y="34">PASTED BY HAND</text>
<text class="l5-tag l5-good" x="480" y="34">A SKILL IN THE REPO</text>
<path class="rule" d="M450,20 L450,450"/>
<g class="st s1 s2 s3"><rect class="paper" x="40" y="50" width="370" height="74" rx="6"/><text class="mono strong" x="58" y="78">notes/commit-prompt.txt</text><text class="mono" x="58" y="104">Commit for StockApi; scan secrets.</text></g>
<g class="st s1"><path class="l5-paste" d="M58,124 L58,188 L70,188" marker-end="url(#l5p-head)"/><rect class="l5-bubble" x="76" y="148" width="334" height="80" rx="12"/><text class="note l5-left" x="92" y="170">Session 1 · pasted by you</text><text class="mono" x="92" y="194">Commit for StockApi; scan secrets.</text><text class="mark ok" x="392" y="172">✓</text></g>
<g class="st s2"><path class="l5-paste" d="M58,124 L58,284 L70,284" marker-end="url(#l5p-head)"/><rect class="l5-bubble wrong" x="76" y="244" width="334" height="80" rx="12"/><text class="note l5-left" x="92" y="266">Session 2 · pasted from an old copy</text><text class="mono" x="92" y="290">Commit for <tspan class="l5-badtxt">ExamDomain (Angular)</tspan>.</text><text class="mark no" x="392" y="268">✕</text><text class="note l5-left l5-bad" x="92" y="312">another project’s name, left in</text></g>
<g class="st s3"><path class="l5-paste" d="M58,124 L58,380 L70,380" marker-end="url(#l5p-head)"/><rect class="l5-bubble wrong" x="76" y="340" width="334" height="80" rx="12"/><text class="note l5-left" x="92" y="362">Session 3 · a teammate’s copy</text><text class="mono" x="92" y="386">Commit for StockApi.</text><text class="mark no" x="392" y="364">✕</text><text class="note l5-left l5-bad" x="92" y="408">the secret-scan line is gone</text></g>
<g class="st s3"><text class="sub" x="225" y="448">three copies, three procedures</text></g>
<g class="st s4 s5 s6"><rect class="l5-repo" x="480" y="50" width="390" height="190" rx="10"/><text class="fname dim" x="500" y="82">stockapi/</text><text class="fname" x="516" y="110">.agents/skills/commit/</text><rect class="doc read" x="532" y="124" width="170" height="36" rx="7"/><g class="ico" transform="translate(542,130) scale(0.85)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></g><text class="fname" x="566" y="148">SKILL.md</text><text class="note l5-left" x="500" y="196">versioned in git, cloned with the code,</text><text class="note l5-left" x="500" y="216">changed only through a reviewed diff</text></g>
<g class="st s5 s6"><path class="arc" d="M577,240 L540,298" marker-end="url(#l5p-head)"/><circle class="ring-node" cx="540" cy="332" r="30"/><text class="fname" x="540" y="337" style="text-anchor:middle;font-size:13px">/commit</text><text class="sub" x="540" y="386">session 1</text><text class="mark ok" x="540" y="408">✓</text></g>
<g class="st s5 s6"><path class="arc" d="M617,240 L675,298" marker-end="url(#l5p-head)"/><circle class="ring-node" cx="675" cy="332" r="30"/><text class="fname" x="675" y="337" style="text-anchor:middle;font-size:13px">/commit</text><text class="sub" x="675" y="386">session 2</text><text class="mark ok" x="675" y="408">✓</text></g>
<g class="st s5 s6"><path class="arc" d="M657,240 L810,298" marker-end="url(#l5p-head)"/><circle class="ring-node" cx="810" cy="332" r="30"/><text class="fname" x="810" y="337" style="text-anchor:middle;font-size:13px">/commit</text><text class="sub" x="810" y="386">session 3</text><text class="mark ok" x="810" y="408">✓</text></g>
<g class="st s5"><text class="sub" x="675" y="448">same file, same steps, every run</text></g>
<g class="st s6"><rect class="chip pass" x="714" y="126" width="144" height="32" rx="16"/><text class="chiptxt" x="786" y="147">1 commit fixes it</text></g>
</svg>
