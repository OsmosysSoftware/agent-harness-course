<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-label="Top: an honest history has commits spread across the day, one per finished slice. A replayed history has dozens of commits stamped with the same second, written after the work was done. Bottom: a mistake on a shared branch. Fixed forward, a new revert commit undoes it and both stay visible. Force-pushed away, the remote is rewritten, teammates’ copies no longer match, and the record of the mistake is gone; branch protection can refuse the push.">
<defs><marker id="l10h-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<g class="st s1"><text class="l10-row" x="30" y="66">Honest</text><text class="l10-rowsub" x="30" y="86">one commit per slice</text><path class="l10-axis" d="M200,70 L820,70"/><path class="l10-tick" d="M200,64 L200,76"/><text class="l10-hour" x="200" y="94">09:00</text><path class="l10-tick" d="M407,64 L407,76"/><text class="l10-hour" x="407" y="94">12:00</text><path class="l10-tick" d="M613,64 L613,76"/><text class="l10-hour" x="613" y="94">15:00</text><path class="l10-tick" d="M820,64 L820,76"/><text class="l10-hour" x="820" y="94">18:00</text><circle class="l10-dot" cx="237" cy="70" r="7"/><circle class="l10-dot" cx="281" cy="70" r="7"/><circle class="l10-dot" cx="367" cy="70" r="7"/><circle class="l10-dot" cx="411" cy="70" r="7"/><circle class="l10-dot" cx="485" cy="70" r="7"/><circle class="l10-dot" cx="560" cy="70" r="7"/><circle class="l10-dot" cx="591" cy="70" r="7"/><circle class="l10-dot" cx="677" cy="70" r="7"/><circle class="l10-dot" cx="746" cy="70" r="7"/><circle class="l10-dot" cx="789" cy="70" r="7"/></g>
<g class="st s2"><text class="l10-row" x="30" y="186">Replayed</text><text class="l10-rowsub" x="30" y="206">written afterwards</text><path class="l10-axis" d="M200,206 L820,206"/><path class="l10-tick" d="M200,200 L200,212"/><text class="l10-hour" x="200" y="230">09:00</text><path class="l10-tick" d="M407,200 L407,212"/><text class="l10-hour" x="407" y="230">12:00</text><path class="l10-tick" d="M613,200 L613,212"/><text class="l10-hour" x="613" y="230">15:00</text><path class="l10-tick" d="M820,200 L820,212"/><text class="l10-hour" x="820" y="230">18:00</text><rect class="l10-burst" x="761" y="196" width="18" height="7" rx="2"/><rect class="l10-burst" x="761" y="187" width="18" height="7" rx="2"/><rect class="l10-burst" x="761" y="178" width="18" height="7" rx="2"/><rect class="l10-burst" x="761" y="169" width="18" height="7" rx="2"/><rect class="l10-burst" x="761" y="160" width="18" height="7" rx="2"/><rect class="l10-burst" x="761" y="151" width="18" height="7" rx="2"/><rect class="l10-burst" x="761" y="142" width="18" height="7" rx="2"/><rect class="l10-burst" x="761" y="133" width="18" height="7" rx="2"/><rect class="l10-burst" x="761" y="124" width="18" height="7" rx="2"/><rect class="l10-burst" x="761" y="115" width="18" height="7" rx="2"/><rect class="l10-burst" x="761" y="106" width="18" height="7" rx="2"/><text class="l10-burstlbl" x="748" y="112" style="text-anchor:end">56 commits, one timestamp</text><path class="l10-lead" d="M752,108 L766,108 L766,100"/><rect class="l10-term" x="200" y="122" width="430" height="46" rx="6"/><text class="l10-mono" x="214" y="141">$ git log --format=%ci | sort | uniq -c | awk …</text><text class="l10-mono l10-badtxt" x="214" y="160">     56 ‹the same second›</text></g>
<path class="l10-divider" d="M30,262 L830,262"/>
<text class="l10-head" x="30" y="296">A mistake reaches the shared branch</text>
<g class="st s3 s5"><text class="l10-sidehead" x="30" y="336">Fix forward</text><path class="l10-chain" d="M54,390 L330,390"/><circle class="l10-commit " cx="54" cy="390" r="17"/><text class="l10-ctxt " x="54" y="395">A</text><circle class="l10-commit " cx="144" cy="390" r="17"/><text class="l10-ctxt " x="144" y="395">B</text><circle class="l10-commit l10-x" cx="234" cy="390" r="17"/><text class="l10-ctxt l10-x" x="234" y="395">X</text><text class="l10-small" x="234" y="436" style="text-anchor:middle">the mistake</text></g>
<g class="st s5"><circle class="l10-commit l10-r" cx="324" cy="390" r="17"/><text class="l10-ctxt l10-r" x="324" y="395">R</text><text class="l10-small" x="324" y="436" style="text-anchor:middle">git revert X</text><text class="l10-good" x="30" y="482">✓ X and its undo both stay in the log</text><text class="l10-good" x="30" y="506">✓ every copy of the branch still agrees</text></g>
<g class="st s4"><text class="l10-sidehead" x="470" y="336">Force-push it away</text><path class="l10-chain" d="M494,390 L640,390"/><circle class="l10-commit " cx="494" cy="390" r="17"/><text class="l10-ctxt " x="494" y="395">A</text><circle class="l10-commit " cx="584" cy="390" r="17"/><text class="l10-ctxt " x="584" y="395">B</text><circle class="l10-ghost" cx="674" cy="390" r="17"/><text class="l10-ctxt l10-gtxt" x="674" y="395">X</text><path class="l10-strike" d="M656,372 L692,408 M692,372 L656,408"/><rect class="l10-refuse" x="712" y="372" width="118" height="36" rx="8"/><text class="l10-refusetxt" x="771" y="388">branch protection</text><text class="l10-refusetxt" x="771" y="402">can refuse it</text><text class="l10-badtxt l10-plain" x="470" y="482">✗ teammates who pulled X no longer match</text><text class="l10-badtxt l10-plain" x="470" y="506">✗ the record of the mistake is gone</text></g>
</svg>
