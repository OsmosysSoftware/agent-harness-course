<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-label="Anatomy of a 1-3-1 card. One problem names the real blocker. Three options each carry their cost, so the workaround the agent would have taken is visible. One recommendation lets you answer in a word. Then it waits, and changes nothing until you answer.">
<rect class="l3-card" x="30" y="20" width="450" height="390" rx="14"/>
<g class="st s1"><rect class="l3-row" x="46" y="36" width="418" height="92" rx="8"/><text class="l3-key" x="62" y="60">1 PROBLEM</text><text class="l3-txt" x="62" y="84">InMemory can’t run ExecuteUpdateAsync, and</text><text class="l3-txt" x="62" y="106">that guarded UPDATE is what stops overselling.</text></g>
<g class="st s1"><path class="l3-lead" d="M484,82 C505,82 505,64 530,64"/><circle class="l3-dot" cx="484" cy="82" r="4"/><text class="lbl" x="540" y="70" style="text-anchor:start">1 problem</text><text class="sub" x="540" y="91" style="text-anchor:start">The real blocker, not “it failed”.</text><text class="sub" x="540" y="110" style="text-anchor:start">A wrong diagnosis shows up here.</text></g>
<g class="st s2"><text class="l3-key" x="62" y="160">3 OPTIONS</text>
<rect class="l3-row" x="46" y="170" width="418" height="30" rx="7"/><text class="l3-txt" x="62" y="190">1  Test on real SQLite<tspan class="l3-dim"> · the repo’s own setup</tspan></text>
<rect class="l3-row" x="46" y="208" width="418" height="30" rx="7"/><text class="l3-txt" x="62" y="228">2  InMemory for the rest<tspan class="l3-dim"> · PlaceAsync untested</tspan></text>
<rect class="l3-row" x="46" y="246" width="418" height="30" rx="7"/><text class="l3-txt" x="62" y="266">3  Rewrite as read-then-write<tspan class="l3-cost"> · oversells</tspan></text>
</g>
<g class="st s2"><path class="l3-lead" d="M484,225 C505,225 505,179 530,179"/><circle class="l3-dot" cx="484" cy="225" r="4"/><text class="lbl" x="540" y="185" style="text-anchor:start">3 options, each with its cost</text><text class="sub" x="540" y="206" style="text-anchor:start">The shortcut it would have taken</text><text class="sub" x="540" y="225" style="text-anchor:start">is on the list, with its price.</text></g>
<g class="st s3"><rect class="l3-badge" x="46" y="300" width="132" height="28" rx="14"/><text class="l3-badgetxt" x="112" y="319">RECOMMEND 1</text><text class="l3-txt" x="192" y="319">fix the test setup, not the code</text></g>
<g class="st s3"><path class="l3-lead" d="M484,314 C505,314 505,284 530,284"/><circle class="l3-dot" cx="484" cy="314" r="4"/><text class="lbl" x="540" y="290" style="text-anchor:start">1 recommendation</text><text class="sub" x="540" y="311" style="text-anchor:start">You can reply “1” and move on,</text><text class="sub" x="540" y="330" style="text-anchor:start">or disagree with a reason.</text></g>
<g class="st s4"><text class="l3-wait" x="62" y="378">Waiting for your call.</text></g>
<g class="st s4"><path class="l3-lead" d="M484,373 C505,373 505,366 530,366"/><circle class="l3-dot" cx="484" cy="373" r="4"/><text class="lbl" x="540" y="372" style="text-anchor:start">Then it stops</text><text class="sub" x="540" y="393" style="text-anchor:start">Nothing installed, launched,</text><text class="sub" x="540" y="412" style="text-anchor:start">downgraded or deleted meanwhile.</text></g>
</svg>
