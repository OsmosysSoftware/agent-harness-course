<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="Which instruction file Claude Code reads. AGENTS.md alone: it reads AGENTS.md. With a CLAUDE.md: it reads CLAUDE.md only. With a CLAUDE.local.md: AGENTS.md is skipped with no warning. With a CLAUDE.md whose first line is @AGENTS.md: it reads both, AGENTS.md once.">
<g class="st s1"><rect class="ring-node panel" x="12" y="8" width="216" height="284" rx="14"/><text class="num" x="34" y="40">1</text><text class="lbl" x="50" y="40" style="text-anchor:start;font-size:15px">AGENTS.md alone</text><text class="sub" x="26" y="62" style="text-anchor:start;font-size:13px">your repo after this lesson</text><g class="ico" transform="translate(26,76) scale(0.9)"><path d="M3 6h6l2 2h10v11H3z"/></g><text class="fname dim" x="52" y="93">stockapi/</text><rect class="doc read" x="26" y="106" width="188" height="34" rx="7"/><text class="mark ok" x="46" y="129">✓</text><g class="ico" transform="translate(56,113) scale(0.85)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></g><text class="fname" x="78" y="128">AGENTS.md</text><line class="rule" x1="26" y1="212" x2="214" y2="212"/><text class="verdict" x="120.0" y="256">Reads AGENTS.md</text></g>
