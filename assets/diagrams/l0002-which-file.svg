<g class="st s3"><rect class="ring-node panel" x="492" y="8" width="216" height="284" rx="14"/><text class="num" x="514" y="40">3</text><text class="lbl" x="530" y="40" style="text-anchor:start;font-size:15px">Add CLAUDE.local.md</text><text class="sub" x="506" y="62" style="text-anchor:start;font-size:13px">private notes, not committed</text><g class="ico" transform="translate(506,76) scale(0.9)"><path d="M3 6h6l2 2h10v11H3z"/></g><text class="fname dim" x="532" y="93">stockapi/</text><rect class="doc read" x="506" y="106" width="188" height="34" rx="7"/><text class="mark ok" x="526" y="129">✓</text><g class="ico" transform="translate(536,113) scale(0.85)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></g><text class="fname" x="558" y="128">CLAUDE.local.md</text><rect class="doc skip" x="506" y="152" width="188" height="34" rx="7"/><text class="mark no" x="526" y="175">✕</text><g class="ico" transform="translate(536,159) scale(0.85)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></g><text class="fname" x="558" y="174">AGENTS.md</text><line class="strike" x1="556" y1="169" x2="637.4" y2="169"/><line class="rule" x1="506" y1="212" x2="694" y2="212"/><text class="verdict" x="600.0" y="238">AGENTS.md skipped,</text><text class="verdict" x="600.0" y="260">no warning</text></g>
<g class="st s4"><rect class="ring-node panel" x="732" y="8" width="216" height="284" rx="14"/><text class="num" x="754" y="40">4</text><text class="lbl" x="770" y="40" style="text-anchor:start;font-size:15px">CLAUDE.md imports it</text><text class="sub" x="746" y="62" style="text-anchor:start;font-size:13px">first line: @AGENTS.md</text><g class="ico" transform="translate(746,76) scale(0.9)"><path d="M3 6h6l2 2h10v11H3z"/></g><text class="fname dim" x="772" y="93">stockapi/</text><rect class="doc read" x="746" y="106" width="188" height="34" rx="7"/><text class="mark ok" x="766" y="129">✓</text><g class="ico" transform="translate(776,113) scale(0.85)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></g><text class="fname" x="798" y="128">CLAUDE.md</text><rect class="doc read" x="746" y="152" width="188" height="34" rx="7"/><text class="mark ok" x="766" y="175">✓</text><g class="ico" transform="translate(776,159) scale(0.85)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></g><text class="fname" x="798" y="174">AGENTS.md</text><text class="note" x="798" y="204">via @import</text><line class="rule" x1="746" y1="212" x2="934" y2="212"/><text class="verdict" x="840.0" y="238">Reads both,</text><text class="verdict" x="840.0" y="260">AGENTS.md once</text></g>
