<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" role="img" aria-label="The agent loop: you send a message into the context window; the model reads it all and picks a tool call; the harness allows or denies it; the tool runs and its result goes back into the context window.">
<defs><marker id="loop-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<circle class="track" cx="470" cy="215" r="150"/>
<text class="hub" x="470" y="209">one turn</text><text class="hubsub" x="470" y="231">repeats until done</text>
<g class="st s2"><path class="arc" d="M521.3,74.0 A150,150 0 0 1 588.2,122.7" marker-end="url(#loop-head)"/><text class="num" x="575.8" y="74.4">2</text></g>
<g class="st s3"><path class="arc" d="M619.9,220.2 A150,150 0 0 1 594.4,298.9" marker-end="url(#loop-head)"/><text class="num" x="641.2" y="275.6">3</text></g>
<g class="st s4"><path class="arc" d="M511.3,359.2 A150,150 0 0 1 428.7,359.2" marker-end="url(#loop-head)"/><text class="num" x="470.0" y="400.0">4</text><text class="deny" x="517.0" y="279.7">✕ or ✓</text></g>
<g class="st s5"><path class="arc" d="M345.6,298.9 A150,150 0 0 1 418.7,74.0" marker-end="url(#loop-head)"/><text class="num" x="298.8" y="164.4">5</text></g>
<g class="st s1"><path class="arc" d="M150,65.0 L418.0,65.0" marker-end="url(#loop-head)"/><text class="num" x="284.0" y="55.0">1</text></g>
<g class="st s1"><circle class="ring-node" cx="100.0" cy="65.0" r="44"/><g class="ico" transform="translate(78.0,43.0) scale(1.8333)"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g><text class="lbl" x="100.0" y="131.0">You</text><text class="sub" x="100.0" y="151.0">type a message</text></g>
<g class="st s2"><circle class="ring-node" cx="470.0" cy="65.0" r="44"/><g class="ico" transform="translate(448.0,43.0) scale(1.8333)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 13h10M7 16h6"/></g><text class="lbl" x="470.0" y="131.0">Context window</text><text class="sub" x="470.0" y="151.0">everything it knows</text></g>
<g class="st s3"><circle class="ring-node" cx="612.7" cy="168.6" r="44"/><g class="ico" transform="translate(590.7,146.6) scale(1.8333)"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></g><text class="lbl" x="670.7" y="166.6" style="text-anchor:start">Model</text><text class="sub" x="670.7" y="186.6" style="text-anchor:start">picks the next step</text></g>
<g class="st s4"><circle class="ring-node" cx="558.2" cy="336.4" r="44"/><g class="ico" transform="translate(536.2,314.4) scale(1.8333)"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></g><text class="lbl" x="616.2" y="334.4" style="text-anchor:start">Harness</text><text class="sub" x="616.2" y="354.4" style="text-anchor:start">can say no</text></g>
<g class="st s5"><circle class="ring-node" cx="381.8" cy="336.4" r="44"/><g class="ico" transform="translate(359.8,314.4) scale(1.8333)"><path d="M14.5 6.5a4 4 0 0 0-5.3 5.2L4 17l3 3 5.3-5.2a4 4 0 0 0 5.2-5.3l-2.6 2.6-2.4-.6-.6-2.4z"/></g><text class="lbl" x="381.8" y="402.4">Tools</text><text class="sub" x="381.8" y="422.4">read · edit · run</text></g>
</svg>
