<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-label="Two ways out of a wall. The agent runs dotnet build and finds no .NET 8 SDK. Path A: it quietly retargets net7.0, nobody notices, and the broken requirement surprises you in review. Path B: it hands over a 1-3-1, one problem, three options with costs and one recommendation, and waits while you choose.">
<defs><marker id="l3w-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<g class="st s1"><circle class="ring-node" cx="80" cy="245" r="38"/><g class="ico" transform="translate(61.0,226.0) scale(1.5833)"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></g><text class="lbl" x="80" y="307">Agent</text><text class="sub" x="80" y="326">runs dotnet build</text></g>
<g class="st s1"><path class="arc" d="M124,245 L190,245" marker-end="url(#l3w-head)"/><rect class="l3-wall" x="200" y="140" width="30" height="200" rx="3"/><path class="l3-brick" d="M200,165 h30"/><path class="l3-brick" d="M200,190 h30"/><path class="l3-brick" d="M200,215 h30"/><path class="l3-brick" d="M200,240 h30"/><path class="l3-brick" d="M200,265 h30"/><path class="l3-brick" d="M200,290 h30"/><path class="l3-brick" d="M200,315 h30"/><path class="l3-brick" d="M208,150 v25"/><path class="l3-brick" d="M215,175 v25"/><path class="l3-brick" d="M208,200 v25"/><path class="l3-brick" d="M215,225 v25"/><path class="l3-brick" d="M208,250 v25"/><path class="l3-brick" d="M215,275 v25"/><path class="l3-brick" d="M208,300 v25"/><text class="lbl" x="215" y="372">No .NET 8 SDK</text><text class="sub" x="215" y="391">only 6 and 7 installed</text></g>
<text class="l3-tag l3-a" x="252" y="44">A · decides quietly</text>
<g class="st bad s2"><path class="arc" d="M234,175 C275,175 290,95 326,95" marker-end="url(#l3w-head)"/></g>
<g class="st bad s2"><circle class="ring-node" cx="372" cy="95" r="38"/><g class="ico" transform="translate(353.0,76.0) scale(1.5833)"><path d="M12 4v15"/><path d="M6 13l6 6 6-6"/><path d="M5 4h14"/></g><text class="lbl" x="372" y="157">Retargets net7.0</text><text class="sub" x="372" y="176">one quiet sentence</text></g>
<g class="st bad s3"><path class="arc" d="M414,95 L594,95" marker-end="url(#l3w-head)"/><text class="sub" x="504" y="83">nobody sees it</text></g>
<g class="st bad s3"><circle class="ring-node" cx="640" cy="95" r="38"/><g class="ico" transform="translate(621.0,76.0) scale(1.5833)"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><path d="M12 17.2v.3"/></g><text class="lbl" x="640" y="157">Surprise in review</text><text class="sub" x="640" y="176">a requirement broke</text></g>
<text class="l3-tag l3-b" x="322" y="214">B · hands over a 1-3-1</text>
<g class="st s4 s5 s6 s7"><path class="arc" d="M234,300 L314,300" marker-end="url(#l3w-head)"/><rect class="l3-card" x="320" y="226" width="330" height="214" rx="12"/></g>
<g class="st s4"><text class="l3-key" x="338" y="252">1 PROBLEM</text><text class="l3-txt" x="338" y="273">No .NET 8 SDK; the brief needs net8.0</text></g>
<text class="l3-key" x="338" y="303">3 OPTIONS</text>
<g class="st s5"><rect class="l3-row" x="332" y="312" width="306" height="26" rx="6"/><text class="l3-txt" x="344" y="330">1  Install the .NET 8 SDK<tspan class="l3-dim"> · ~5 min</tspan></text></g>
<g class="st s5"><rect class="l3-row" x="332" y="344" width="306" height="26" rx="6"/><text class="l3-txt" x="344" y="362">2  Build in a .NET 8 container<tspan class="l3-dim"></tspan></text></g>
<g class="st s5"><rect class="l3-row" x="332" y="376" width="306" height="26" rx="6"/><text class="l3-txt" x="344" y="394">3  Target net7.0<tspan class="l3-cost"> · breaks the brief</tspan></text></g>
<g class="st s6"><rect class="l3-badge" x="332" y="408" width="124" height="24" rx="12"/><text class="l3-badgetxt" x="394" y="425">RECOMMEND 1</text><text class="l3-dim" x="468" y="425">Waiting for your call.</text></g>
<g class="st s7"><path class="arc" d="M654,330 L702,330" marker-end="url(#l3w-head)"/></g>
<g class="st s7"><circle class="ring-node" cx="750" cy="330" r="38"/><g class="ico" transform="translate(731.0,311.0) scale(1.5833)"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g><text class="lbl" x="750" y="392">You choose</text><text class="sub" x="750" y="411">and log it in PLAN.md</text></g>
</svg>
