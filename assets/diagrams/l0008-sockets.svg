<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-label="What an MCP server is. Claude Code, the harness, has built-in tools such as Read, Edit and Bash, and two sockets. The context7 server, named in .mcp.json and started with npx at a pinned version, plugs into one socket. It is a process on your machine running as you, and it sends your query to context7.com. Its two tools, mcp__context7__resolve-library-id and mcp__context7__query-docs, join the tool list and pass the same permission check as any tool. A lock on its cable shows that a project server waits for your approval. A community SQLite server stays unplugged: its vetting tag has unanswered questions, so it is not added; read-only data comes through Bash with sqlite3 -readonly -safe.">
<rect class="l8-harness" x="20" y="40" width="360" height="420" rx="16"/>
<text class="lbl" x="200" y="72">Claude Code (the harness)</text>
<text class="sub" x="200" y="94">runs the loop from lesson 1</text>
<text class="l8-key" x="44" y="132">TOOLS THE MODEL CAN CALL</text>
<rect class="l8-row" x="40" y="142" width="320" height="30" rx="7"/><text class="l8-code" x="54" y="162">Read · Edit · Write · Bash · …</text>
<rect class="l8-socket" x="370" y="214" width="22" height="32" rx="5"/><circle class="l8-pin" cx="381" cy="224" r="2.6"/><circle class="l8-pin" cx="381" cy="236" r="2.6"/>
<rect class="l8-socket" x="370" y="364" width="22" height="32" rx="5"/><circle class="l8-pin" cx="381" cy="374" r="2.6"/><circle class="l8-pin" cx="381" cy="386" r="2.6"/>
<g class="st s1"><text class="l8-note" x="356" y="132" style="text-anchor:end">built in</text></g>
<g class="st s2 s3 s4"><path class="l8-cable" d="M392,230 C430,230 430,150 470,150"/><rect class="l8-plug" x="470" y="137" width="24" height="26" rx="5"/><path class="l8-prong" d="M470,144 L460,144 M470,156 L460,156"/><rect class="l8-server" x="494" y="58" width="346" height="190" rx="12"/><text class="l8-srvname" x="512" y="86">context7</text><text class="l8-srvsub" x="600" y="86">an MCP server</text><text class="l8-mono-sm" x="512" y="112">npx -y @upstash/context7-mcp@4.1.1</text><text class="l8-plain" x="512" y="140">a process on your machine,</text><text class="l8-plain" x="512" y="159">running as you</text><text class="l8-note" x="512" y="192">sends your question to context7.com,</text><text class="l8-note" x="512" y="210">returns library docs as text</text></g>
<g class="st s3 s4"><rect class="l8-row l8-new" x="40" y="182" width="320" height="30" rx="7"/><text class="l8-code" x="52" y="202">mcp__context7__resolve-library-id</text><rect class="l8-row l8-new" x="40" y="218" width="320" height="30" rx="7"/><text class="l8-code" x="52" y="238">mcp__context7__query-docs</text><text class="l8-note" x="44" y="272">same permission check as any tool</text></g>
<g class="st s4"><circle class="l8-lockbg" cx="431" cy="190" r="20"/><g class="l8-lock" transform="translate(419,178)"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><rect class="l8-badge" x="494" y="258" width="346" height="34" rx="17"/><text class="l8-badgetxt" x="667" y="280">⏸ Pending approval until you say yes</text></g>
<g class="st s5"><path class="l8-cable l8-loose" d="M392,380 C420,380 440,392 452,400"/><rect class="l8-server l8-cand" x="494" y="312" width="346" height="164" rx="12"/><text class="l8-srvname" x="512" y="340">a community SQLite server</text><text class="l8-q" x="512" y="368">☐ who maintains it? when was its last release?</text><text class="l8-q" x="512" y="392">☐ have you read the source?</text><text class="l8-q" x="512" y="416">☐ can it write, delete or run commands?</text><g transform="rotate(-6 760 452)"><rect class="l8-stamp" x="688" y="434" width="138" height="34" rx="6"/><text class="l8-stamptxt" x="757" y="457">NOT ADDED</text></g><rect class="l8-row l8-alt" x="40" y="396" width="320" height="48" rx="7"/><text class="l8-code" x="52" y="416">Bash: sqlite3 -readonly -safe …</text><text class="l8-note" x="52" y="436">the database engine refuses writes</text></g>
</svg>
