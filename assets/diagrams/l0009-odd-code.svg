<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-label="The agent fixes what looks odd. Top: the stock update is one guarded ExecuteUpdateAsync with no comment. A fresh agent asked to simplify it rewrites it as load the product, check, subtract, save: shorter, and it oversells under concurrent orders. Bottom: the same code with a one-line comment pointing to docs/decisions/0001. The agent follows the pointer, reads the decision record, declines, cites 0001 and offers options. Likelier, not guaranteed: the reviewer and the concurrency test still back it up.">
<defs><marker id="l9o-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="l9-lane" x="30" y="26">Code alone</text>
<text class="l9-lane" x="30" y="282">Code + a one-line pointer + an ADR</text>
<line class="l9-divider" x1="30" y1="252" x2="830" y2="252"/>
<g class="st s1 s2"><rect class="l9-card " x="30" y="38" width="330" height="140" rx="9"/><text class="l9-cardhead" x="44" y="60">OrderService.cs</text><text class="l9-code " x="44" y="86">var updated = await db.Products</text><text class="l9-code " x="44" y="107">  .Where(p =&gt; p.Stock &gt;= q &amp;&amp; …)</text><text class="l9-code " x="44" y="128">  .ExecuteUpdateAsync(… Stock - q …);</text><text class="l9-code " x="44" y="149">if (updated == 0) return …;</text><text class="l9-note" x="30" y="204">no entity loaded, no <tspan class="l9-mono">Stock -= q</tspan>: it looks odd</text></g>
<g class="st s2"><rect class="l9-prompt" x="372" y="74" width="128" height="30" rx="15"/><text class="l9-prompttxt" x="436" y="94">“simplify this”</text><g class="ico" transform="translate(422.0,120.0) scale(1.1667)"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V3"/><circle cx="9" cy="13" r="1.2"/><circle cx="15" cy="13" r="1.2"/></g><path class="arc" d="M364,150 L508,150" marker-end="url(#l9o-head)"/><rect class="l9-card l9-badcard" x="520" y="38" width="310" height="140" rx="9"/><text class="l9-cardhead" x="534" y="60">the agent’s rewrite</text><text class="l9-code l9-bad" x="534" y="86">var p = await …FindAsync(id);</text><text class="l9-code l9-bad" x="534" y="107">if (p.Stock &lt; q) return …;</text><text class="l9-code l9-bad" x="534" y="128">p.Stock -= q;</text><text class="l9-code l9-bad" x="534" y="149">await db.SaveChangesAsync();</text><text class="l9-verdict l9-badtxt" x="675" y="204">shorter, and it oversells</text></g>
<g class="st s3 s4 s5"><rect class="l9-hl" x="38" y="324" width="314" height="22" rx="4"/><rect class="l9-card " x="30" y="294" width="330" height="162" rx="9"/><text class="l9-cardhead" x="44" y="316">OrderService.cs</text><text class="l9-code l9-comment" x="44" y="342">// … see docs/decisions/0001.</text><text class="l9-code " x="44" y="363">var updated = await db.Products</text><text class="l9-code " x="44" y="384">  .Where(p =&gt; p.Stock &gt;= q &amp;&amp; …)</text><text class="l9-code " x="44" y="405">  .ExecuteUpdateAsync(… Stock - q …);</text><text class="l9-code " x="44" y="426">if (updated == 0) return …;</text></g>
<g class="st s3 s4 s5"><g class="ico" transform="translate(422.0,286.0) scale(1.1667)"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V3"/><circle cx="9" cy="13" r="1.2"/><circle cx="15" cy="13" r="1.2"/></g><path class="arc" d="M352,335 C420,335 450,335 508,335" marker-end="url(#l9o-head)"/><text class="l9-small" x="436" y="356">follows the pointer</text><rect class="l9-card l9-doc" x="520" y="294" width="310" height="92" rx="9"/><text class="l9-cardhead" x="534" y="316">docs/decisions/0001-…md</text><text class="l9-code l9-docline" x="534" y="342">Decision: one guarded UPDATE</text><text class="l9-code l9-docline" x="534" y="363">load, check, save oversells</text></g>
<g class="st s4 s5"><rect class="l9-reply" x="520" y="398" width="310" height="58" rx="10"/><text class="l9-replytxt" x="534" y="421">Declined: 0001 forbids load-check-save.</text><text class="l9-replysub" x="534" y="443">Options: keep it, or a new ADR you approve.</text></g>
<g class="st s5"><text class="l9-caption" x="430" y="496">Likelier, not guaranteed: the stock reviewer and ConcurrencyTests still back it up.</text></g>
</svg>
