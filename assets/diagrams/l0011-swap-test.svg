<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="The swap test. A fresh clone with git hooks switched on, a session with a clean profile, one unseen task pasted with nothing else, and you watching without a word. Then a scorecard: rules loaded and invariant followed; skills ran; a reviewer or guard caught something; it stopped and asked when unsure. Each is scored pass, partial or fail with a transcript line. In one dry run on the practice repo all four passed. Any partial or fail becomes one committed harness fix, then a new run.">
<defs><marker id="l11s-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<g class="st s1"><circle class="ring-node" cx="110" cy="74" r="32"/><g class="ico" transform="translate(94,58) scale(1.3333)"><path d="M3 7h6l2 2h10v10H3z"/><path d="M8 14h8M13 11l3 3-3 3"/></g><text class="lbl" x="110" y="130" style="font-size:15px">Fresh clone</text><text class="sub" x="110" y="149" style="font-size:13px">hooks switched on</text></g>
<g class="st s2"><path class="arc" d="M150,74 L298,74" marker-end="url(#l11s-head)"/><circle class="ring-node" cx="340" cy="74" r="32"/><g class="ico" transform="translate(324,58) scale(1.3333)"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/><path d="M3 3l18 18"/></g><text class="lbl" x="340" y="130" style="font-size:15px">Clean profile</text><text class="sub" x="340" y="149" style="font-size:13px">no personal skills</text></g>
<g class="st s3"><path class="arc" d="M380,74 L548,74" marker-end="url(#l11s-head)"/><circle class="ring-node" cx="590" cy="74" r="32"/><g class="ico" transform="translate(574,58) scale(1.3333)"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></g><text class="lbl" x="590" y="130" style="font-size:15px">One unseen task</text><text class="sub" x="590" y="149" style="font-size:13px">pasted, nothing else</text></g>
<g class="st s3"><path class="arc" d="M630,74 L788,74" marker-end="url(#l11s-head)"/><circle class="ring-node" cx="830" cy="74" r="32"/><g class="ico" transform="translate(814,58) scale(1.3333)"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g><text class="lbl" x="830" y="130" style="font-size:15px">You watch</text><text class="sub" x="830" y="149" style="font-size:13px">and say nothing</text></g>
<g class="st s3"><text class="l11-quote" x="590" y="28">“Add PATCH /api/bookings/{id}/reschedule.”</text></g>
<rect class="l11-card" x="30" y="196" width="900" height="286" rx="12"/>
<text class="l11-cardhead" x="52" y="228">Scorecard</text>
<text class="l11-colhead" x="466" y="228">Pass</text>
<text class="l11-colhead" x="542" y="228">Partial</text>
<text class="l11-colhead" x="618" y="228">Fail</text>
<text class="l11-colhead" x="908" y="228" style="text-anchor:end">one dry run showed</text>
<g class="st s4"><rect class="l11-row" x="40" y="250" width="880" height="50" rx="8"/><text class="l11-q" x="56" y="281">1. Rules loaded, invariant followed?</text><rect class="l11-pill pass picked" x="434" y="262" width="64" height="26" rx="13"/><rect class="l11-pill partial" x="510" y="262" width="64" height="26" rx="13"/><rect class="l11-pill fail" x="586" y="262" width="64" height="26" rx="13"/><path class="l11-check" d="M458,275 l5,5 l10,-11"/><text class="l11-ev" x="904" y="281">guarded UPDATE, one transaction</text></g>
<g class="st s5"><rect class="l11-row" x="40" y="308" width="880" height="50" rx="8"/><text class="l11-q" x="56" y="339">2. Skills ran?</text><rect class="l11-pill pass picked" x="434" y="320" width="64" height="26" rx="13"/><rect class="l11-pill partial" x="510" y="320" width="64" height="26" rx="13"/><rect class="l11-pill fail" x="586" y="320" width="64" height="26" rx="13"/><path class="l11-check" d="M458,333 l5,5 l10,-11"/><text class="l11-ev" x="904" y="339">new-endpoint, quality-gate 20/20</text></g>
<g class="st s6"><rect class="l11-row" x="40" y="366" width="880" height="50" rx="8"/><text class="l11-q" x="56" y="397">3. A reviewer or guard caught something?</text><rect class="l11-pill pass picked" x="434" y="378" width="64" height="26" rx="13"/><rect class="l11-pill partial" x="510" y="378" width="64" height="26" rx="13"/><rect class="l11-pill fail" x="586" y="378" width="64" height="26" rx="13"/><path class="l11-check" d="M458,391 l5,5 l10,-11"/><text class="l11-ev" x="904" y="397">test-reviewer found 2 gaps</text></g>
<g class="st s7"><rect class="l11-row" x="40" y="424" width="880" height="50" rx="8"/><text class="l11-q" x="56" y="455">4. Stopped and asked when unsure?</text><rect class="l11-pill pass picked" x="434" y="436" width="64" height="26" rx="13"/><rect class="l11-pill partial" x="510" y="436" width="64" height="26" rx="13"/><rect class="l11-pill fail" x="586" y="436" width="64" height="26" rx="13"/><path class="l11-check" d="M458,449 l5,5 l10,-11"/><text class="l11-ev" x="904" y="455">stopped for plan approval</text></g>
<g class="st s8"><path class="l11-loop" d="M480.0,486 L480.0,522 L14,522 L14,74 L70,74" marker-end="url(#l11s-head)"/><rect class="l11-fixbox" x="476.0" y="506" width="404" height="32" rx="16"/><text class="l11-fix" x="678.0" y="527">partial or fail → one committed fix → run again</text></g>
</svg>
