<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-label="The commit skill as a checkpoint line. A staged change passes seven gates in order: see what is staged (never git add -A), refuse build output such as obj and tmp, refuse secrets, check the work email identity, draft the message from the diff, wait for your approval, then commit and never push. Under each gate is what it turns away.">
<defs><marker id="l5c-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<path class="l5-wire" d="M84,110 L842,110"/>
<g class="st s1"><rect class="l5-repo" x="22" y="80" width="60" height="60" rx="8"/><g class="ico" transform="translate(36,94) scale(1.35)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></g><text class="l5-glbl" x="52" y="164">staged</text><text class="l5-glbl" x="52" y="182">change</text></g>
<g class="st s1 s2 s3 s4 s5 s6 s7"><path class="arc" d="M84,110 L98,110" marker-end="url(#l5c-head)"/><rect class="ring-node" x="102" y="78" width="76" height="64" rx="12"/><text class="num" x="140" y="117" style="font-size:22px">1</text><text class="l5-glbl" x="140" y="50">See what’s</text><text class="l5-glbl" x="140" y="69">staged</text></g>
<g class="st s1"><path class="l5-drop" d="M140,144 L140,180"/><rect class="l5-rej" x="90" y="184" width="100" height="58" rx="9"/><text class="l5-rejtxt" x="140" y="208">git add -A</text><text class="l5-rejtxt" x="140" y="228">never used</text><text class="mark no" x="140" y="268">✕</text></g>
<g class="st s2 s3 s4 s5 s6 s7"><path class="arc" d="M178,110 L203,110" marker-end="url(#l5c-head)"/><rect class="ring-node" x="207" y="78" width="76" height="64" rx="12"/><text class="num" x="245" y="117" style="font-size:22px">2</text><text class="l5-glbl" x="245" y="50">No build</text><text class="l5-glbl" x="245" y="69">output</text></g>
<g class="st s2"><path class="l5-drop" d="M245,144 L245,180"/><rect class="l5-rej" x="195" y="184" width="100" height="58" rx="9"/><text class="l5-rejtxt" x="245" y="208">obj/, tmp/,</text><text class="l5-rejtxt" x="245" y="228">bin/, .env</text><text class="mark no" x="245" y="268">✕</text></g>
<g class="st s3 s4 s5 s6 s7"><path class="arc" d="M283,110 L308,110" marker-end="url(#l5c-head)"/><rect class="ring-node" x="312" y="78" width="76" height="64" rx="12"/><text class="num" x="350" y="117" style="font-size:22px">3</text><text class="l5-glbl" x="350" y="50">No</text><text class="l5-glbl" x="350" y="69">secrets</text></g>
<g class="st s3"><path class="l5-drop" d="M350,144 L350,180"/><rect class="l5-rej" x="300" y="184" width="100" height="58" rx="9"/><text class="l5-rejtxt" x="350" y="208">Key: “Sup…</text><text class="l5-rejtxt" x="350" y="228">signing key</text><text class="mark no" x="350" y="268">✕</text></g>
<g class="st s4 s5 s6 s7"><path class="arc" d="M388,110 L413,110" marker-end="url(#l5c-head)"/><rect class="ring-node" x="417" y="78" width="76" height="64" rx="12"/><text class="num" x="455" y="117" style="font-size:22px">4</text><text class="l5-glbl" x="455" y="50">Work</text><text class="l5-glbl" x="455" y="69">identity</text></g>
<g class="st s4"><path class="l5-drop" d="M455,144 L455,180"/><rect class="l5-rej" x="405" y="184" width="100" height="58" rx="9"/><text class="l5-rejtxt" x="455" y="208">a personal</text><text class="l5-rejtxt" x="455" y="228">address</text><text class="mark no" x="455" y="268">✕</text></g>
<g class="st s5 s6 s7"><path class="arc" d="M493,110 L518,110" marker-end="url(#l5c-head)"/><rect class="ring-node" x="522" y="78" width="76" height="64" rx="12"/><text class="num" x="560" y="117" style="font-size:22px">5</text><text class="l5-glbl" x="560" y="50">Message</text><text class="l5-glbl" x="560" y="69">from the diff</text></g>
<g class="st s5"><path class="l5-drop" d="M560,144 L560,180"/><rect class="l5-rej" x="510" y="184" width="100" height="58" rx="9"/><text class="l5-rejtxt" x="560" y="208">“Update the</text><text class="l5-rejtxt" x="560" y="228">changes”</text><text class="mark no" x="560" y="268">✕</text></g>
<g class="st s6 s7"><path class="arc" d="M598,110 L623,110" marker-end="url(#l5c-head)"/><rect class="ring-node" x="627" y="78" width="76" height="64" rx="12"/><text class="num" x="665" y="117" style="font-size:22px">6</text><text class="l5-glbl" x="665" y="50">You</text><text class="l5-glbl" x="665" y="69">approve</text></g>
<g class="st s6"><path class="l5-drop" d="M665,144 L665,180"/><rect class="l5-rej" x="615" y="184" width="100" height="58" rx="9"/><text class="l5-rejtxt" x="665" y="208">no yes,</text><text class="l5-rejtxt" x="665" y="228">no commit</text><text class="mark no" x="665" y="268">✕</text></g>
<g class="st s7"><path class="arc" d="M703,110 L728,110" marker-end="url(#l5c-head)"/><rect class="ring-node" x="732" y="78" width="76" height="64" rx="12"/><text class="num" x="770" y="117" style="font-size:22px">7</text><text class="l5-glbl" x="770" y="50">Commit,</text><text class="l5-glbl" x="770" y="69">never push</text></g>
<g class="st s7"><path class="l5-drop" d="M770,144 L770,180"/><rect class="l5-rej" x="720" y="184" width="100" height="58" rx="9"/><text class="l5-rejtxt" x="770" y="208">git push</text><text class="l5-rejtxt" x="770" y="228">is yours</text><text class="mark no" x="770" y="268">✕</text></g>
<g class="st s7"><path class="arc" d="M808,110 L846,110" marker-end="url(#l5c-head)"/><circle class="l5-done" cx="866" cy="110" r="14"/><text class="mark ok" x="866" y="116">✓</text><text class="l5-glbl" x="866" y="50">one</text><text class="l5-glbl" x="866" y="69">commit</text></g>
<text class="sub" x="450" y="336">Each gate stops the line and tells you what to do; none of them works around a failure.</text>
</svg>
