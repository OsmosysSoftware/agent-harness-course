<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-label="Who each guard binds. Permission rules and the PreToolUse hook bind only the agent inside Claude Code. Git hooks bind everyone who commits in a clone where core.hooksPath is set: you in a terminal, Claude Code, Codex and Antigravity. The guard test binds whoever runs the tests, including CI.">
<path class="l7-rail" d="M330,140 L330,384"/>
<path class="l7-rail" d="M440,140 L440,384"/>
<path class="l7-rail" d="M550,140 L550,384"/>
<path class="l7-rail" d="M660,140 L660,384"/>
<path class="l7-rail" d="M770,140 L770,384"/>
<circle class="ring-node" cx="330" cy="62" r="28"/><g class="ico" transform="translate(316,48) scale(1.1667)"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g><text class="lbl" x="330" y="114" style="font-size:14px">You</text><text class="sub" x="330" y="132" style="font-size:12.5px">in a terminal</text>
<circle class="ring-node" cx="440" cy="62" r="28"/><g class="ico" transform="translate(426,48) scale(1.1667)"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></g><text class="lbl" x="440" y="114" style="font-size:14px">Claude Code</text>
<circle class="ring-node" cx="550" cy="62" r="28"/><g class="ico" transform="translate(536,48) scale(1.1667)"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10l3 2-3 2"/><path d="M12 15h5"/></g><text class="lbl" x="550" y="114" style="font-size:14px">Codex</text>
<circle class="ring-node" cx="660" cy="62" r="28"/><g class="ico" transform="translate(646,48) scale(1.1667)"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10l3 2-3 2"/><path d="M12 15h5"/></g><text class="lbl" x="660" y="114" style="font-size:14px">Antigravity</text>
<circle class="ring-node" cx="770" cy="62" r="28"/><g class="ico" transform="translate(756,48) scale(1.1667)"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></g><text class="lbl" x="770" y="114" style="font-size:14px">CI</text><text class="sub" x="770" y="132" style="font-size:12.5px">or a teammate</text>
<g class="st s1"><rect class="l7-band" x="14" y="160" width="872" height="60" rx="12"/><text class="lbl" x="34" y="187" style="text-anchor:start;font-size:15px">Permission rules,</text><text class="sub" x="34" y="207" style="text-anchor:start;font-size:13px">PreToolUse hook</text><circle class="l7-bind off" cx="330" cy="190" r="7"/><circle class="l7-bind" cx="440" cy="190" r="11"/><path class="l7-tick" d="M435,190 l3.5,3.5 l6.5,-7"/><circle class="l7-bind off" cx="550" cy="190" r="7"/><circle class="l7-bind off" cx="660" cy="190" r="7"/><circle class="l7-bind off" cx="770" cy="190" r="7"/><text class="l7-who" x="520" y="236">binds the agent, in Claude Code only</text></g>
<g class="st s2"><rect class="l7-band" x="14" y="242" width="872" height="60" rx="12"/><text class="lbl" x="34" y="269" style="text-anchor:start;font-size:15px">Git hooks</text><text class="sub" x="34" y="289" style="text-anchor:start;font-size:13px">.githooks/</text><circle class="l7-bind" cx="330" cy="272" r="11"/><path class="l7-tick" d="M325,272 l3.5,3.5 l6.5,-7"/><circle class="l7-bind" cx="440" cy="272" r="11"/><path class="l7-tick" d="M435,272 l3.5,3.5 l6.5,-7"/><circle class="l7-bind" cx="550" cy="272" r="11"/><path class="l7-tick" d="M545,272 l3.5,3.5 l6.5,-7"/><circle class="l7-bind" cx="660" cy="272" r="11"/><path class="l7-tick" d="M655,272 l3.5,3.5 l6.5,-7"/><circle class="l7-bind off" cx="770" cy="272" r="7"/><text class="l7-who" x="520" y="318">binds anyone who commits, in a clone with core.hooksPath set</text></g>
<g class="st s3"><rect class="l7-band" x="14" y="324" width="872" height="60" rx="12"/><text class="lbl" x="34" y="351" style="text-anchor:start;font-size:15px">Guard test</text><text class="sub" x="34" y="371" style="text-anchor:start;font-size:13px">ConcurrencyTests</text><circle class="l7-bind" cx="330" cy="354" r="11"/><path class="l7-tick" d="M325,354 l3.5,3.5 l6.5,-7"/><circle class="l7-bind" cx="440" cy="354" r="11"/><path class="l7-tick" d="M435,354 l3.5,3.5 l6.5,-7"/><circle class="l7-bind" cx="550" cy="354" r="11"/><path class="l7-tick" d="M545,354 l3.5,3.5 l6.5,-7"/><circle class="l7-bind" cx="660" cy="354" r="11"/><path class="l7-tick" d="M655,354 l3.5,3.5 l6.5,-7"/><circle class="l7-bind" cx="770" cy="354" r="11"/><path class="l7-tick" d="M765,354 l3.5,3.5 l6.5,-7"/><text class="l7-who" x="520" y="400">binds whoever runs dotnet test, CI included</text></g>
<text class="l7-note" x="450" y="442">Codex and Antigravity have their own rule and hook files: same idea, separate config</text>
</svg>
